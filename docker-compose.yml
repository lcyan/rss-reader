services:
  server:
    image: ghcr.io/lcyan/rss-reader:latest
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--timeout=5", "http://127.0.0.1:8080/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    container_name: rss-reader
    restart: unless-stopped
    ports:
      - "127.0.0.1:9898:8080"
    volumes:
      - ./data/config.json:/app/config.json
      - ./data/archives.txt:/app/archives.txt
